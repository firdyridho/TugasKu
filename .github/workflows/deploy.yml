name: Deploy to Hosting via FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      server_dir:
        description: 'Folder tujuan di hosting (InfinityFree: htdocs/)'
        required: false
        default: 'htdocs/'
      clean_slate:
        description: 'Upload ulang semua file dari awal'
        type: boolean
        required: false
        default: false

jobs:
  web-deploy:
    name: Deploy to Web Hosting
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 📂 Sync files to Hosting via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOSTNAME }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # InfinityFree mewajibkan file website berada di dalam folder htdocs/
          server-dir: ${{ github.event.inputs.server_dir || secrets.FTP_SERVER_DIR || 'htdocs/' }}
          dangerous-clean-slate: ${{ github.event.inputs.clean_slate == 'true' }}
          log-level: verbose
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
            config_local.php
            uploads/**
            *.sql
            *.md
